<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平阳味道餐厅 · 订单墙（大屏）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1f2a44;
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:#f5ecd8;
    border-radius:14px;overflow:hidden;display:flex;flex-direction:column;padding:10px 14px 12px;}
  .head{display:flex;align-items:center;gap:10px;height:46px;flex:none;}
  .head h1{font-size:26px;font-weight:900;color:#3a2c1c;white-space:nowrap;}
  .rpill{background:#ff7a59;color:#fff;font-weight:900;font-size:16px;padding:4px 14px;border-radius:18px;}
  .prog{font-weight:900;font-size:16px;color:#2b5444;background:#d9efdc;padding:4px 14px;border-radius:18px;}
  .lockpill{background:#b3361f;color:#fff;font-weight:900;font-size:15px;padding:4px 12px;border-radius:18px;}
  .sp{flex:1;}
  .net{font-size:12px;font-weight:800;color:#2b7a3e;} .net.off{color:#b3361f;}
  .tb{border:none;background:#fff;color:#5a4632;font-weight:900;font-size:14px;padding:7px 13px;border-radius:18px;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.14);white-space:nowrap;}
  .tb.pri{background:#2faa4a;color:#fff;} .tb.warn{background:#ffd9d2;color:#b3361f;}
  .tb:disabled{opacity:.4;cursor:default;}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:10px;margin-top:6px;}
  .gc{background:rgba(255,255,255,.55);border:3px dashed #e0cfa8;border-radius:16px;padding:7px 8px 6px;display:flex;flex-direction:column;gap:4px;min-height:0;}
  .gc.sub{background:#fff;border:3px solid #7ccf8c;box-shadow:0 3px 10px rgba(80,120,60,.18);}
  .gc.pop{animation:pop .9s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(.88);box-shadow:0 0 0 0 rgba(47,170,74,.7);}50%{transform:scale(1.05);}100%{transform:scale(1);box-shadow:0 0 0 18px rgba(47,170,74,0);}}
  .gh{display:flex;align-items:center;gap:6px;height:24px;flex:none;}
  .gh b{font-size:17px;color:#ff7a59;font-weight:900;}
  .gh .dot{width:9px;height:9px;border-radius:50%;background:#cfcfcf;}
  .gh .dot.on{background:#2faa4a;}
  .gh .stt{margin-left:auto;font-size:12px;font-weight:900;border-radius:10px;padding:2px 8px;background:#eee;color:#888;}
  .gh .stt.ing{background:#fff1cc;color:#a06a00;} .gh .stt.ok{background:#d6f2da;color:#1d6b2e;}
  .pl{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px 6px;}
  .p{background:rgba(255,248,232,.9);border-radius:10px;padding:3px 5px;display:flex;flex-direction:column;gap:1px;min-height:0;overflow:hidden;}
  .p .t{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:900;color:#7a5a3a;height:30px;}
  .p .t svg{width:30px;height:30px;margin-left:auto;flex:none;}
  .p .t .stars{color:#ffb400;font-size:13px;letter-spacing:0;}
  .its{display:flex;flex-wrap:wrap;gap:2px;}
  .it{width:27px;height:27px;border-radius:50%;overflow:hidden;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.2);background:#f3ead8;}
  .it img{width:100%;height:100%;object-fit:cover;display:block;}
  .p .none{font-size:11px;color:#c7b793;}
  .rt{flex:none;border-top:1px dashed #e3d6b6;padding-top:3px;display:flex;flex-direction:column;gap:0;}
  .rr{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:800;color:#5a4632;line-height:1.1;}
  .rr .s{display:flex;}
  .rr .s i{font-style:normal;font-size:19px;color:#d4d0c4;padding:0 1px;line-height:1.1;}
  .rr .s i.on{color:#ffb400;}
  .auth .rr .s i{cursor:pointer;} .auth .rr .s i:hover{transform:scale(1.2);}

  /* 弹层 */
  .ov{position:absolute;inset:0;background:rgba(30,25,15,.72);display:none;align-items:center;justify-content:center;z-index:50;}
  .ov.show{display:flex;}
  .box{background:#fffaf0;border-radius:20px;padding:20px 24px;max-width:1180px;box-shadow:0 14px 40px rgba(0,0,0,.4);}
  .box h2{font-size:22px;color:#3a2c1c;margin-bottom:10px;}
  .qrs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 16px;}
  .qr{text-align:center;} .qr svg{width:150px;height:150px;display:block;margin:0 auto;background:#fff;padding:5px;border-radius:8px;}
  .qr b{font-size:17px;color:#ff7a59;display:block;margin-top:2px;}
  .qr small{font-size:10px;color:#8a7a60;display:block;word-break:break-all;}
  .box input{font-size:22px;padding:8px 12px;border:2px solid #e0c9a6;border-radius:10px;width:220px;margin:6px 8px 6px 0;}
  .box .row{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;}
  #toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(40,30,20,.9);color:#fff;padding:9px 22px;
    border-radius:20px;font-size:16px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:80;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="stage">
  <div class="head">
    <h1>🏆 Order Wall · 订单墙</h1>
    <span class="rpill" id="rd">Round 1</span>
    <span class="prog" id="prog">已下单 0/10</span>
    <span class="lockpill hide" id="lockpill" style="display:none">🔒 已锁定</span>
    <span class="sp"></span>
    <span class="net off" id="net">● 连接中…</span>
    <button class="tb" onclick="showQR()">📱 二维码</button>
    <button class="tb" id="lockbtn" onclick="toggleLock()">🔒 锁定点单</button>
    <button class="tb warn" onclick="newRound()">▶ 下一轮</button>
    <button class="tb" id="authbtn" onclick="openLogin()">🔑 教师登录</button>
  </div>
  <div class="grid" id="grid"></div>

  <div class="ov" id="ovqr" onclick="if(event.target===this)this.classList.remove('show')">
    <div class="box"><h2>📱 各组扫码入口（每组一个二维码，贴在平板旁或投在课件上）</h2><div class="qrs" id="qrs"></div>
      <div class="row"><button class="tb" onclick="window.print()">🖨 打印</button><button class="tb pri" onclick="$('ovqr').classList.remove('show')">关闭</button></div></div>
  </div>
  <div class="ov" id="ovlogin">
    <div class="box"><h2>🔑 教师登录</h2><div style="color:#7a6a55;font-size:14px">服务器设置了教师密码，登录后才能打分、锁定、开始下一轮。</div>
      <input id="pw" type="password" placeholder="教师密码" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="row"><button class="tb" onclick="$('ovlogin').classList.remove('show')">取消</button><button class="tb pri" onclick="doLogin()">登录</button></div></div>
  </div>
  <div id="toast"></div>
</div>

<script src="shared.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
const $=id=>document.getElementById(id);
let S=null, pw=''; try{ pw=localStorage.getItem('py_pw')||''; }catch(e){}
let authed=true; const popping={}, lastSeq={};

function fit(){ const s=Math.min(innerWidth/1280,innerHeight/720); $('stage').style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }

function stars5(n){ return '★'.repeat(n)+'☆'.repeat(5-n); }
function render(){
  if(!S) return;
  const n=S.n, ids=Array.from({length:n},(_,i)=>i+1);
  $('rd').textContent='Round '+S.round;
  const sub=ids.filter(g=>S.groups[g].submitted).length;
  $('prog').textContent=`已下单 ${sub}/${n}`;
  $('lockpill').style.display=S.locked?'':'none';
  $('lockbtn').textContent=S.locked?'🔓 解锁点单':'🔒 锁定点单';
  $('authbtn').style.display=authed?'none':'';
  $('authbtn').textContent='🔑 教师登录';
  $('grid').style.gridTemplateColumns=`repeat(${n<=10?5:Math.ceil(n/4)},1fr)`;
  $('grid').style.gridTemplateRows=`repeat(${n<=10?2:4},1fr)`;
  $('grid').innerHTML=ids.map(g=>{
    const G=S.groups[g], on=(S.online&&S.online[g])||0;
    const anyItems=G.plates.some(p=>p.items.length);
    const st=G.submitted?['已下单 ✓','ok']:anyItems?['点餐中…','ing']:['未开始',''];
    if(G.submitted && lastSeq[g]!==undefined && lastSeq[g]!==G.submitSeq){ popping[g]=Date.now(); }
    lastSeq[g]=G.submitSeq;
    const el=popping[g]?Date.now()-popping[g]:9999, isPop=el<900;
    const plates=G.plates.map((p,i)=>{
      const r=G.submitted&&G.results&&G.results[i];
      return `<div class="p"><div class="t">${PY.PLATE_NAMES[i]}${r?`<span class="stars">${'★'.repeat(r.core)}</span>${PY.robotSvg(r.core)}`:''}</div>
        <div class="its">${p.items.length?p.items.map(id=>`<div class="it"><img src="${PY.byId(id).img}" alt=""></div>`).join(''):'<span class="none">—</span>'}</div></div>`;
    }).join('');
    const R=G.ratings||{fluent:0,correct:0};
    const rate=(key,lab)=>`<div class="rr"><span>${lab}</span><span class="s">${[1,2,3].map(k=>`<i class="${R[key]>=k?'on':''}" onclick="rate(${g},'${key}',${k},${R[key]})">★</i>`).join('')}</span></div>`;
    return `<div class="gc ${G.submitted?'sub':''} ${isPop?'pop':''} ${authed?'auth':''}" ${isPop?`style="animation-delay:-${(el/1000).toFixed(2)}s"`:''}>
      <div class="gh"><b>Group ${g}</b><span class="dot ${on?'on':''}" title="${on?'平板在线':'平板未连接'}"></span><span class="stt ${st[1]}">${st[0]}</span></div>
      <div class="pl">${plates}</div>
      <div class="rt">${rate('fluent','Fluent dialogue')}${rate('correct','Correct expression')}</div></div>`;
  }).join('');
}

/* ---------- 实时连接 ---------- */
function connect(){
  const es=new EventSource('/events?role=wall');
  es.onopen=()=>{ $('net').textContent='● 实时连接中'; $('net').classList.remove('off'); };
  es.onmessage=e=>{ try{ S=JSON.parse(e.data); render(); }catch(x){} };
  es.onerror=()=>{ $('net').textContent='● 断开，自动重连…'; $('net').classList.add('off'); };
}

/* ---------- 教师操作 ---------- */
async function adm(action,extra){
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({pw,action},extra||{}))});
  if(r.status===401){ authed=false; pw=''; try{localStorage.removeItem('py_pw');}catch(e){} render(); openLogin('密码不对或已失效，请重新登录'); return false; }
  return r.ok;
}
function openLogin(msg){ $('ovlogin').classList.add('show'); $('pw').value=''; setTimeout(()=>$('pw').focus(),50); if(msg) toast(msg); }
async function doLogin(){
  pw=$('pw').value.trim(); if(!pw) return;
  if(await adm('check')){ authed=true; try{localStorage.setItem('py_pw',pw);}catch(e){} $('ovlogin').classList.remove('show'); toast('已登录 ✔'); render(); }
}
async function needAuth(fn){ if(!authed){ openLogin('请先登录教师账号'); return; } await fn(); }
function rate(g,key,k,cur){ needAuth(()=>adm('rate',{g,key,val:cur===k?0:k})); }
function toggleLock(){ needAuth(()=>adm(S.locked?'unlock':'lock')); }
function newRound(){ needAuth(async()=>{ if(confirm('开始下一轮？所有组的点单和评分都会清空。')) { if(await adm('newRound')) toast('已开始新一轮'); } }); }
function showQR(){
  const n=S?S.n:10, base=location.origin;
  $('qrs').innerHTML=Array.from({length:n},(_,i)=>{ const u=`${base}/s.html?g=${i+1}`;
    const q=qrcode(0,'M'); q.addData(u); q.make();
    return `<div class="qr">${q.createSvgTag({cellSize:4,margin:0,scalable:true})}<b>第 ${i+1} 组</b><small>${u}</small></div>`; }).join('');
  $('ovqr').classList.add('show');
}
adm('check').then(ok=>{ if(ok){ authed=true; render(); } });   // 服务器若设置了密码，这里会自动弹出登录框
connect();
</script>
</body>
</html>
